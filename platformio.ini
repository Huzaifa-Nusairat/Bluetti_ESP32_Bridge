[platformio]
src_dir = Bluetti_ESP32

[env]
lib_deps =
    https://github.com/tzapu/WiFiManager/archive/refs/tags/v2.0.15-rc.1.zip
    PubSubClient@^2.8.0
    ElegantOTA@^3.1.4
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1
    Wire
    Spi
extra_scripts = post:scripts/post_esp32.py

[env:esp32dev]
platform = espressif32@6.0.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_compat_mode = strict

; Host tests: every source in Bluetti_ESP32/ except the .ino, built for the computer against the
; stand-ins in host/lib (host/README.md). Run with: pio test -e native
[env:native]
platform = native@1.2.1
lib_deps =
extra_scripts =
test_framework = unity
test_build_src = yes
lib_extra_dirs = host/lib
lib_ldf_mode = chain+
lib_compat_mode = off
build_flags = -std=gnu++17 -DHOST_TEST -I Bluetti_ESP32 -Wno-deprecated-declarations
